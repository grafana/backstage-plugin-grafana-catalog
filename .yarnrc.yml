yarnPath: .yarn/releases/yarn-4.17.1.cjs

# Backstage does not support Plug'n'Play - backstage-cli and the Jest config
# both expect a real node_modules tree.
nodeLinker: node-modules

# ---------------------------------------------------------------------------
# Supply-chain hardening
#
# NOTE: migrating from Yarn 1 wrote permissive values for the first two settings
# below (`approvedGitRepositories: ["**"]` and `npmMinimalAgeGate: 0`) in order
# to preserve Yarn 1 behavior. Both are deliberately overridden here. Do not
# loosen them without a documented reason.
# ---------------------------------------------------------------------------

# No dependency may be installed from a git remote. There are none today, and
# this keeps it that way: git dependencies bypass both the registry and the
# release-age gate below.
approvedGitRepositories: []

# Refuse packages published less than 3 days ago. Yarn 4's default is 1440
# (1 day), which is shorter than the window in which a compromised release is
# typically identified and yanked.
npmMinimalAgeGate: 4320

# Dependencies may not run install-time build scripts. This is already Yarn 4's
# default; it is set explicitly so that a downgrade or an upstream default
# change cannot silently re-enable it.
#
# Verified that lint, tsc, build and the full test suite all pass with this
# disabled, including esbuild, @swc/core and better-sqlite3, which declare
# build scripts.
enableScripts: false
